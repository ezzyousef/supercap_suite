name: Windows build

# Builds the Windows executable, portable zip and installer with the repository's own
# build.ps1 (tests, PyInstaller, self-test of the built exe, Inno Setup), and uploads
# them as a downloadable artifact of the run.
on:
  workflow_dispatch:
  push:
    branches: [claude/intelligent-planck-3addcx]
    tags: ["v*"]

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: "Diagnostics (temporary): which test file crashes at exit"
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem tests -Filter "test_*.py") {
            python -m pytest $f.FullName -q -p no:cacheprovider 2>&1 | Select-Object -Last 1
            Write-Host "EXIT $($f.Name): $LASTEXITCODE"
          }
          git fetch --depth=20 origin claude/intelligent-planck-3addcx
          git worktree add ../before 0ab7775
          Push-Location ../before
          python -m pytest tests -q -p no:cacheprovider 2>&1 | Select-Object -Last 1
          Write-Host "EXIT before-review: $LASTEXITCODE"
          Pop-Location

      - name: Tests
        shell: pwsh
        run: |
          python -X faulthandler -m pytest tests -q -p no:cacheprovider
          $code = $LASTEXITCODE
          Write-Host "pytest exit code: $code"
          exit $code

      - name: Build (exe, self-test, zip, installer)
        shell: pwsh
        run: ./build.ps1 -SkipTests

      - name: Check the outputs exist
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist/*.zip,installer/output/*.exe -ErrorAction SilentlyContinue
          $files | Format-Table Name, Length
          if (-not ($files | Where-Object Name -like "*.zip")) { throw "portable zip missing" }
          if (-not ($files | Where-Object Name -like "*.exe")) { throw "installer missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: SupercapSuite-windows
          path: |
            dist/*.zip
            installer/output/*.exe
          if-no-files-found: error
          retention-days: 30
